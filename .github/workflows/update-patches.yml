
name: Atualizar arquivo de patch notes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar patch notes e dados dos heróis
        run: python collect.py

      - name: Processar alterações por herói
        run: python process.py

      - name: Salvar bancos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json changes.json heroes_data.json
          git diff --cached --quiet || git commit -m "Atualiza banco histórico de Overwatch"
          git push
